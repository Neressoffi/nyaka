# Administration NYAKA (Decap CMS)
# En local : lancer « npm run admin » puis ouvrir http://localhost:3000/admin
# Fichier généré : la structure correspond aux fichiers du dossier content/.

local_backend: true
backend:
  name: github
  repo: Neressoffi/magic
  branch: main
locale: fr
logo_url: /nyaka-logo.png
site_url: http://localhost:3000
display_url: http://localhost:3000
media_folder: public/media
public_folder: /media
collections:
- name: accueil
