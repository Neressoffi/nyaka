- name: realisations
  label: 2. Réalisations (portfolio)
  format: json
  editor:
    preview: false
  files:
  - label: Portfolio — projets, vidéos et textes de la page
    name: portfolio
    file: content/realisations/portfolio.json
    fields:
    - name: page
      label: Textes de la page Réalisations
      widget: object
      collapsed: true
      fields:
      - name: titre
        label: Titre
        widget: string
      - name: introduction
        label: Introduction
        widget: text
      - name: filtres
        label: Noms des filtres
        widget: object
        fields:
        - name: tous
          label: Tous
          widget: string
        - name: branding
          label: Branding & Design
          widget: string
        - name: videos
          label: Vidéos & campagnes
          widget: string
        - name: ia
          label: IA & Data
          widget: string
      - name: etiquettes
        label: Titres des parties des fiches
        widget: object
        fields:
        - name: defi
          label: Le défi
          widget: string
        - name: reponse
          label: Notre réponse
          widget: string
        - name: realisations
          label: Les réalisations
          widget: string
        - name: resultat
          label: Le résultat
          widget: string
    - name: videos_intro
      label: Introduction de la galerie vidéo
      widget: object
      collapsed: true
      fields:
      - name: titre
        label: Titre
        widget: string
      - name: accroche
        label: Accroche
        widget: string
      - name: description
        label: Description
        widget: text
    - name: projets
      label: Projets Branding & Design et IA (glisser pour réordonner)
      widget: list
      collapsed: true
      summary: '{{fields.titre}} — {{fields.statut}}'
      fields:
      - name: titre
        label: Titre du projet
        widget: string
      - name: slug
        label: Adresse de la fiche (slug)
        widget: string
        hint: Ex. kawa-menu-experience → nyakaagency.com/realisations/kawa-menu-experience. Minuscules et tirets, sans accents.
      - name: categorie
        label: Catégorie
        widget: select
        options:
        - label: Branding & Design
          value: branding-design
        - label: IA & Data
          value: ia-data
      - &id001
        name: statut
        label: Statut
        widget: select
        options:
        - label: Publié (visible)
          value: publie
        - label: Brouillon (invisible)
          value: brouillon
        default: brouillon
      - name: expertises
        label: Expertises
        widget: string
        hint: Ex. Design éditorial · Expérience digitale
      - name: accroche
        label: Accroche
        widget: string
      - name: couverture
        label: Couverture
        widget: object
        collapsed: false
        fields:
        - name: image
          label: Visuel principal
          widget: image
          media_folder: /public/media/realisations
          public_folder: /media/realisations
        - name: alt
          label: Texte alternatif (description de l'image)
          widget: string
      - name: defi
        label: 02 · Le défi
        widget: object
        collapsed: false
        fields:
        - name: accroche
          label: Accroche
          widget: string
        - name: texte
          label: Texte (1 à 2 phrases maximum)
          widget: text
      - name: reponse
        label: 03 · Notre réponse
        widget: object
        collapsed: false
        fields:
        - name: accroche
          label: Accroche
          widget: string
        - name: texte
          label: Texte (1 à 2 phrases maximum)
          widget: text
      - name: realisations
        label: 04 · Les réalisations
        widget: object
        collapsed: false
        fields:
        - name: accroche
          label: Accroche
          widget: string
        - name: texte
          label: Texte (1 à 2 phrases maximum)
          widget: text
      - name: resultat
        label: 05 · Le résultat
        widget: object
        collapsed: false
        fields:
        - name: accroche
          label: Accroche
          widget: string
        - name: texte
          label: Texte (1 à 2 phrases maximum)
          widget: text
      - name: galerie
        label: Galerie (glisser pour réordonner)
        widget: list
        required: false
        collapsed: true
        summary: '{{fields.type}} — {{fields.legende}}'
        fields:
        - name: image
          label: Image
          widget: image
          media_folder: /public/media/realisations
          public_folder: /media/realisations
        - name: type
          label: Type de livrable
          widget: string
          hint: Ex. Catalogue, Logo, Photos en situation… Les images du même type sont regroupées.
        - name: legende
          label: Légende courte
          widget: string
          required: false
        - name: alt
          label: Texte alternatif
          widget: string
        - name: autorise
          label: Autorisé à la publication
          widget: boolean
          default: true
    - name: videos
      label: Vidéos & campagnes (glisser pour réordonner)
      widget: list
      collapsed: true
      summary: '{{fields.client}} — {{fields.titre}} — {{fields.statut}}'
      fields:
      - name: titre
        label: Titre
        widget: string
      - name: client
        label: Client
        widget: string
      - *id001
      - name: format
        label: Format
        widget: select
        options:
        - label: Horizontal (16:9)
          value: horizontal
        - label: Vertical (9:16)
          value: vertical
        default: horizontal
      - name: miniature
        label: Miniature (16:9)
        widget: image
        media_folder: /public/media/realisations/VID
        public_folder: /media/realisations/VID
      - name: alt
        label: Texte alternatif de la miniature
        widget: string
        required: false
      - name: video
        label: Fichier vidéo (MP4)
        widget: file
        required: false
        media_folder: /public/media/realisations/VID
        public_folder: /media/realisations/VID
        hint: Sans fichier, la vidéo reste invisible même si elle est publiée.
      - name: description
        label: Description courte (1 à 2 phrases)
        widget: text
      - name: note
        label: Note interne (non affichée)
        widget: text
        required: false
